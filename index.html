<style>
  :root {
    --bg: #ffffff;
    --bg-2: #f2f2f2;
    --ink: #1a1a1a;
    --ink-2: #3a3a3a;
    --mute: #9a9a9a;
    --line: #2a2a2a;
    --line-faint: #aaaaaa;
    --accent: #1a1a1a;
    --hex: #e4e4e4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic Medium", "Noto Sans JP", sans-serif;
    font-weight: 300;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  /* ========== Header ========== */
  .header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
    background: linear-gradient(180deg, var(--bg) 60%, transparent 100%);
    pointer-events: none;
  }
  .header > * { pointer-events: auto; }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: 0.15em;
  }
  .logo-hex {
    display: flex; gap: 2px;
  }
  .logo-hex span {
    width: 8px; height: 9px;
    background: var(--hex);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }

  .title-sub {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--mute);
  }

  .docs-btn {
    background: var(--bg);
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 8px 14px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 0.18em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .docs-btn:active, .docs-btn:hover {
    background: var(--ink);
    color: var(--bg);
  }

  /* ========== Docs Gallery (full-screen modal) ========== */
  .docs-modal {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 200;
    display: none;
    flex-direction: column;
  }
  .docs-modal.open { display: flex; }

  .docs-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line-faint);
    background: var(--bg);
  }
  .docs-title {
    font-size: 12px;
    letter-spacing: 0.25em;
    color: var(--ink);
  }
  .docs-close {
    background: none;
    border: 1px solid var(--ink);
    width: 32px; height: 32px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .docs-tabs {
    display: flex;
    border-bottom: 1px solid var(--line-faint);
    background: var(--bg);
  }
  .docs-tab {
    flex: 1;
    padding: 12px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--mute);
    cursor: pointer;
    transition: all 0.2s;
  }
  .docs-tab.active {
    color: var(--ink);
    border-bottom-color: var(--ink);
  }

  .docs-pages {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 20px 16px 80px 16px;
    background: var(--bg-2);
  }
  .docs-page-set {
    display: none;
  }
  .docs-page-set.active {
    display: block;
  }
  .docs-page {
    width: 100%;
    max-width: 720px;
    margin: 0 auto 24px auto;
    background: var(--bg);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid var(--line-faint);
  }
  .docs-page img {
    width: 100%;
    height: auto;
    display: block;
  }
  .docs-page-num {
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--mute);
    padding: 8px;
    margin-bottom: 4px;
  }

  .docs-footer {
    text-align: center;
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--mute);
    padding: 16px;
    border-top: 1px solid var(--line-faint);
    background: var(--bg);
  }

  /* ========== Main stage ========== */
  .stage {
    width: 100vw;
    height: 100vh;
    cursor: grab;
    position: relative;
    touch-action: none;
  }
  .stage.dragging { cursor: grabbing; }

  .canvas-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1px;
    height: 1px;
    transform-origin: center center;
    transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
  }
  .canvas-wrap.no-transition { transition: none; }

  /* SVG is centered within canvas-wrap (a 1x1 anchor point at screen center) */
  .canvas-wrap svg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    overflow: visible;
    display: block;
  }

  /* ========== Nodes ========== */
  .node {
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .node circle.node-dot {
    fill: var(--ink);
    transition: all 0.3s;
  }
  .node circle.node-ring,
  .node rect.node-ring {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1;
    transition: all 0.3s;
  }
  .node:hover circle.node-ring,
  .node:hover rect.node-ring {
    stroke-width: 1.5;
  }
  .node.active circle.node-ring,
  .node.active rect.node-ring {
    stroke-width: 2;
  }
  .node.active circle.node-dot {
    r: 5;
  }
  .node-label {
    font-size: 14px;
    fill: var(--ink);
    font-weight: 300;
    letter-spacing: 0.05em;
    text-anchor: middle;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .node-sub {
    font-size: 9px;
    fill: var(--mute);
    letter-spacing: 0.15em;
    text-anchor: middle;
    pointer-events: none;
  }
  .node-root .node-label {
    font-size: 22px;
    letter-spacing: 0.1em;
  }
  .node-category .node-label {
    font-size: 11px;
    letter-spacing: 0.2em;
    fill: var(--ink-2);
  }

  .link {
    fill: none;
    stroke: var(--line-faint);
    stroke-width: 1.2;
    stroke-dasharray: 3 4;
    transition: all 0.4s;
  }
  .link.highlight {
    stroke: var(--ink);
    stroke-dasharray: none;
    stroke-width: 1.5;
  }

  .hex-deco {
    fill: var(--hex);
    opacity: 0.6;
  }

  /* ========== Drawer ========== */
  .drawer {
    position: fixed;
    top: 0; right: 0;
    width: 380px;
    max-width: 90vw;
    height: 100vh;
    background: var(--bg);
    border-left: 1px solid var(--ink);
    padding: 70px 28px 28px 28px;
    transform: translateX(100%);
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 80;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-close {
    position: absolute;
    top: 16px; right: 20px;
    background: none;
    border: 1px solid var(--ink);
    width: 34px; height: 34px;
    cursor: pointer;
    font-family: inherit;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .drawer-handle {
    display: none;
  }

  .drawer h2 {
    font-size: 34px;
    font-weight: 300;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }
  .drawer .sub {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--mute);
    margin-bottom: 24px;
  }
  .drawer h3 {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--mute);
    margin: 22px 0 10px 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line-faint);
  }
  .drawer p {
    font-size: 13px;
    line-height: 1.9;
    margin-bottom: 10px;
  }
  .drawer .tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.15em;
    padding: 3px 10px;
    border: 1px solid var(--ink);
    margin-right: 6px;
    margin-bottom: 4px;
  }
  .drawer .example {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 13px;
    padding: 10px 14px;
    background: var(--bg-2);
    margin-bottom: 6px;
    letter-spacing: 0.08em;
  }

  .footer-link {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--mute);
    text-decoration: none;
    transition: color 0.2s;
  }
  .footer-link:hover { color: var(--ink); }

  /* ========== Hint overlay ========== */
  .hint-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.85);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.4s;
    backdrop-filter: blur(2px);
  }
  .hint-box {
    text-align: center;
    padding: 32px 40px;
    border: 1px solid var(--ink);
    background: var(--bg);
  }
  .hint-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .hint-key {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--ink);
    width: 80px;
    text-align: right;
  }
  .hint-sep {
    color: var(--mute);
  }
  .hint-desc {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--ink-2);
    width: 140px;
    text-align: left;
  }
  .hint-dismiss {
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--mute);
    margin-top: 20px;
  }

  /* タグ・例文のクリック可能スタイル */
  .drawer .tag[data-goto] {
    cursor: pointer;
    transition: all 0.2s;
  }
  .drawer .tag[data-goto]:hover,
  .drawer .tag[data-goto]:focus {
    background: var(--ink);
    color: var(--bg);
    outline: none;
  }
  .drawer .link-example {
    cursor: pointer;
    transition: background 0.2s;
  }
  .drawer .link-example:hover,
  .drawer .link-example:focus {
    background: var(--line-faint);
    outline: none;
  }

  /* ========== Footer ========== */
  .footer {
    position: fixed;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    letter-spacing: 0.3em;
    color: var(--mute);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 40;
    white-space: nowrap;
  }
  .footer span.dash {
    width: 24px;
    height: 1px;
    background: var(--mute);
  }

  /* ========== Zoom controls ========== */
  .zoom-ctrl {
    position: fixed;
    right: 16px; bottom: 50px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    z-index: 60;
  }
  .zoom-btn {
    width: 36px; height: 36px;
    background: var(--bg);
    border: 1px solid var(--ink);
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .zoom-btn:active { background: var(--ink); color: var(--bg); }

  /* ========================================================
     PORTRAIT / MOBILE LAYOUT
     ======================================================== */
  @media (max-width: 768px), (orientation: portrait) {
    .header {
      padding: 12px 16px;
    }
    .title-sub { display: none; }
    .logo { font-size: 11px; }

    .docs-btn {
      font-size: 9px;
      padding: 6px 10px;
      letter-spacing: 0.15em;
    }

    .docs-pages {
      padding: 16px 12px 60px 12px;
    }
    .docs-tab {
      font-size: 10px;
      padding: 10px 8px;
      letter-spacing: 0.12em;
    }
    .docs-title {
      font-size: 10px;
      letter-spacing: 0.18em;
    }

    /* Drawer → bottom sheet */
    .drawer {
      top: auto;
      right: 0;
      left: 0;
      bottom: 0;
      width: 100%;
      max-width: 100%;
      height: 72vh;
      max-height: 72vh;
      border-left: none;
      border-top: 1px solid var(--ink);
      padding: 28px 22px 40px 22px;
      transform: translateY(100%);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
    }
    .drawer.open { transform: translateY(0); }

    .drawer-handle {
      display: block;
      position: absolute;
      top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 4px;
      background: var(--line-faint);
      border-radius: 2px;
    }

    .drawer-close {
      top: 14px;
      right: 14px;
      width: 30px;
      height: 30px;
      font-size: 14px;
    }

    .drawer h2 {
      font-size: 28px;
    }
    .drawer h3 {
      font-size: 10px;
      margin: 18px 0 8px 0;
    }
    .drawer p {
      font-size: 12px;
    }
    .drawer .example {
      font-size: 12px;
    }

    .footer {
      font-size: 8px;
      letter-spacing: 0.25em;
      gap: 8px;
      bottom: 12px;
    }
    .footer span.dash {
      width: 16px;
    }

    .zoom-ctrl {
      right: 12px;
      bottom: 46px;
    }
    .zoom-btn {
      width: 34px;
      height: 34px;
    }
  }

  @media (max-height: 600px) and (orientation: portrait) {
    .drawer {
      height: 80vh;
      max-height: 80vh;
    }
  }
</style>
</head>

<script>
const data = {
  id: "arico",
  label: "Arico",
  kana: "アリコ",
  type: "root",
  meaning: "ありちゃん諸語の祖語",
  desc: "少語彙・広意味・状態共有中心の祖語。群れ維持・経路共有・危険伝達・育成・運搬のために最適化された、きわめて実務的な言語。",
  children: [
    {
      id: "cat-space", label: "空間", type: "category",
      meaning: "位置・方向・経路の語根",

        { id: "ko", label: "ko", kana: "コ", meaning: "内・巣", desc: "所属領域、安全圏、維持すべき内部。", examples: ["ko sa. · 巣内異常なし", "ma ko. · 幼体を内に"] },
        { id: "do", label: "do", kana: "ド", meaning: "外・外側", desc: "巣外、異所、境界の向こう側。", examples: ["do ke. · 外に危険", "su do. · 外へ向かう"] },
        { id: "ra", label: "ra", kana: "ラ", meaning: "核・中心・帰還点", desc: "すべてが在るべき中心。祖語の基軸語。", examples: ["ra sa. · 核は安定", "to ra. · 核へ戻る道"] },
        { id: "to", label: "to", kana: "ト", meaning: "道・経路・つながり", desc: "運ばれる道、辿られる経路、結ぶもの。", examples: ["to sa. · 経路は安全", "to zu. · 経路異常"] },
      ]
    },
    {
      id: "cat-group", label: "群れ", type: "category",
      meaning: "個体と他者の語根",
      children: [

const svg = document.getElementById('svg');
const NS = "http://www.w3.org/2000/svg";

function el(tag, attrs = {}, parent = null) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

const isPortrait = () => window.innerHeight > window.innerWidth;

const catRadius = 240;
const leafRadius = 420;

const categories = data.children;
const nCat = categories.length;

const catAngles = {};
categories.forEach((c, i) => {
  const angle = (i / nCat) * Math.PI * 2 - Math.PI / 2;
  catAngles[c.id] = angle;
});

const positions = {};
positions[data.id] = { x: 0, y: 0 };

categories.forEach((cat) => {
  const angle = catAngles[cat.id];
  positions[cat.id] = {
    x: Math.cos(angle) * catRadius,
    y: Math.sin(angle) * catRadius,
    angle
  };

  const nLeaves = cat.children.length;
  const spread = Math.PI / 3.5;
  cat.children.forEach((leaf, j) => {
    const t = nLeaves === 1 ? 0.5 : j / (nLeaves - 1);
    const leafAngle = angle - spread / 2 + spread * t;
    positions[leaf.id] = {
      x: Math.cos(leafAngle) * leafRadius,
      y: Math.sin(leafAngle) * leafRadius,
      angle: leafAngle,
      parent: cat.id
    };
  });
});

const hexGroup = el('g', { class: 'hex-bg' }, svg);
for (let i = 0; i < 14; i++) {
  const angle = (i / 14) * Math.PI * 2;
  const r = 500 + Math.random() * 80;
  const x = Math.cos(angle) * r;
  const y = Math.sin(angle) * r;
  const size = 6 + Math.random() * 4;
  el('polygon', {
    class: 'hex-deco',
    points: hexPoints(x, y, size),
    opacity: 0.3 + Math.random() * 0.3
  }, hexGroup);
}

function hexPoints(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
    pts.push(`${cx + Math.cos(a) * r},${cy + Math.sin(a) * r}`);
  }
  return pts.join(' ');
}

const ringGroup = el('g', {}, svg);
[catRadius, leafRadius].forEach(r => {
  el('circle', {
    cx: 0, cy: 0, r: r,
    fill: 'none',
    stroke: 'var(--line-faint)',
    'stroke-width': 0.8,
    'stroke-dasharray': '2 5'
  }, ringGroup);
});

const linkGroup = el('g', { class: 'links' }, svg);
categories.forEach(cat => {
  const p = positions[cat.id];
  el('line', {
    class: 'link',
    x1: 0, y1: 0, x2: p.x, y2: p.y,
    'data-to': cat.id
  }, linkGroup);
  cat.children.forEach(leaf => {
    const l = positions[leaf.id];
    el('line', {
      class: 'link',
      x1: p.x, y1: p.y, x2: l.x, y2: l.y,
      'data-from': cat.id,
      'data-to': leaf.id
    }, linkGroup);
  });
});

const nodeGroup = el('g', { class: 'nodes' }, svg);

function drawNode(node, pos, type) {
  const ariaLabel = node.kana
    ? `${node.label}（${node.kana}）— ${node.meaning || ''}`
    : `${node.label} — ${node.meaning || ''}`;
  const g = el('g', {
    class: `node node-${type}`,
    transform: `translate(${pos.x},${pos.y})`,
    'data-id': node.id,
    'tabindex': '0',
    'role': 'button',
    'aria-label': ariaLabel
  }, nodeGroup);

  if (type === 'root') {
    el('circle', { class: 'node-ring', cx: 0, cy: 0, r: 38 }, g);
    el('circle', { class: 'node-ring', cx: 0, cy: 0, r: 26 }, g);
    el('circle', { class: 'node-ring', cx: 0, cy: 0, r: 14 }, g);
    el('circle', { class: 'node-dot', cx: 0, cy: 0, r: 4 }, g);
    el('text', { class: 'node-label', x: 0, y: 62 }, g).textContent = node.label;
    el('text', { class: 'node-sub', x: 0, y: 80 }, g).textContent = 'ARICO · 祖語';
    el('circle', { cx: 0, cy: 0, r: 50, fill: 'transparent' }, g);
  } else if (type === 'category') {
    el('circle', { class: 'node-ring', cx: 0, cy: 0, r: 18 }, g);
    el('circle', { class: 'node-dot', cx: 0, cy: 0, r: 3 }, g);
    const angle = pos.angle;
    const lx = Math.cos(angle) * 32;
    const ly = Math.sin(angle) * 32;
    const t = el('text', { class: 'node-label', x: lx, y: ly + 4 }, g);
    t.textContent = node.label;
    t.setAttribute('text-anchor', Math.cos(angle) > 0.2 ? 'start' : Math.cos(angle) < -0.2 ? 'end' : 'middle');
    el('circle', { cx: 0, cy: 0, r: 28, fill: 'transparent' }, g);
  } else {
    const isPoem = node.isPoem;
    if (isPoem) {
      el('rect', {
        class: 'node-ring',
        x: -10, y: -10, width: 20, height: 20,
        transform: 'rotate(45)'
      }, g);
    } else {
      el('circle', { class: 'node-ring', cx: 0, cy: 0, r: 12 }, g);
    }
    el('circle', { class: 'node-dot', cx: 0, cy: 0, r: 3 }, g);
    const angle = pos.angle;
    const lx = Math.cos(angle) * 28;
    const ly = Math.sin(angle) * 28;
    const t = el('text', { class: 'node-label', x: lx, y: ly + 4 }, g);
    t.textContent = node.label;
    t.setAttribute('text-anchor', Math.cos(angle) > 0.2 ? 'start' : Math.cos(angle) < -0.2 ? 'end' : 'middle');
    el('circle', { cx: 0, cy: 0, r: 22, fill: 'transparent' }, g);
  }
}

drawNode(data, positions[data.id], 'root');
categories.forEach(cat => drawNode(cat, positions[cat.id], 'category'));
categories.forEach(cat => {
  cat.children.forEach(leaf => drawNode(leaf, positions[leaf.id], 'leaf'));
});

let activeId = null;

function findNode(id) {
  if (data.id === id) return data;
  for (const c of data.children) {
    if (c.id === id) return c;
    for (const l of c.children) {
      if (l.id === id) return l;
    }
  }
  return null;
}

function findParentChain(id) {
  const chain = [];
  for (const c of data.children) {
    if (c.id === id) { chain.push(data.id); return chain; }
    for (const l of c.children) {
      if (l.id === id) { chain.push(data.id, c.id); return chain; }
    }
  }
  return chain;
}

// シングルタップ → ハイライト、ダブルタップ → ドロワー表示
const tapTimers = {};
const TAP_DELAY = 280; // ms

document.querySelectorAll('.node').forEach(node => {
  node.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = node.dataset.id;
    const nodeData = findNode(id);
    if (!nodeData) return;

    if (tapTimers[id]) {
      // ダブルタップ：ドロワーを開く
      clearTimeout(tapTimers[id]);
      delete tapTimers[id];
      showDrawer(nodeData);
      if (!isPortrait() && window.innerWidth > 768) {
        const pos = positions[id];
        if (pos && id !== 'arico') {
          panTo(pos.x, pos.y, Math.max(scale, 1.1));
        }
      }
    } else {
      // シングルタップ：ハイライトのみ
      tapTimers[id] = setTimeout(() => {
        delete tapTimers[id];
      }, TAP_DELAY);

      // 同じノードを再タップした場合はハイライト解除
      if (activeId === id) {
        resetHighlights();
        closeDrawer();
        activeId = null;
      } else {
        resetHighlights();
        highlightPath(id);
        activeId = id;
        // ドロワーが開いていたら内容だけ閉じる
        closeDrawer();
      }
    }
  });
});

function highlightPath(id) {
  // 上流：Arico → 選択ノードまでの経路
  const chain = findParentChain(id);
  chain.push(id);
  for (let i = 0; i < chain.length - 1; i++) {
    const from = chain[i];
    const to = chain[i + 1];
    const link = from === 'arico'
      ? document.querySelector(`line[data-to="${to}"]:not([data-from])`)
      : document.querySelector(`line[data-from="${from}"][data-to="${to}"]`);
    if (link) link.classList.add('highlight');
  }
  chain.forEach(cid => {
    const n = document.querySelector(`[data-id="${cid}"]`);
    if (n) n.classList.add('active');
  });

  // 下流：選択ノードから先につながる子・孫もハイライト
  function highlightChildren(nodeId) {
    const nodeData = findNode(nodeId);
    if (!nodeData || !nodeData.children) return;
    nodeData.children.forEach(child => {
      const link = nodeId === 'arico'
        ? document.querySelector(`line[data-to="${child.id}"]:not([data-from])`)
        : document.querySelector(`line[data-from="${nodeId}"][data-to="${child.id}"]`);
      if (link) link.classList.add('highlight');
      const childEl = document.querySelector(`[data-id="${child.id}"]`);
      if (childEl) childEl.classList.add('active');
      highlightChildren(child.id);
    });
  }
  highlightChildren(id);
}

function resetHighlights() {
  document.querySelectorAll('.node.active').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.link.highlight').forEach(l => l.classList.remove('highlight'));
}

const drawer = document.getElementById('drawer');
const drawerContent = document.getElementById('drawer-content');
document.getElementById('drawer-close').addEventListener('click', () => {
  closeDrawer();
  resetHighlights();
  activeId = null;
});

function showDrawer(node) {
  let html = '';
  html += `<h2>${node.label}</h2>`;
  if (node.kana) html += `<div class="sub">${node.kana} · ${node.type === 'root' ? '祖語' : node.type === 'category' ? 'カテゴリ' : node.isPoem ? '古語句' : '核語根'}</div>`;
  else html += `<div class="sub">${node.type === 'root' ? '祖語' : node.type === 'category' ? 'カテゴリ' : node.isPoem ? '古語句' : '核語根'}</div>`;

  if (node.meaning) {
    html += `<h3>意味</h3><p>${node.meaning}</p>`;
  }
  if (node.desc) {
    html += `<h3>解説</h3><p>${node.desc}</p>`;
  }

  if (node.examples && node.examples.length) {
    html += `<h3>例文</h3>`;
    node.examples.forEach(ex => {
      html += `<div class="example">${ex}</div>`;
    });
  }

  if (node.children && node.children.length) {
    html += `<h3>派生 / 内包</h3><div>`;
    node.children.forEach(c => {
      html += `<span class="tag" data-goto="${c.id}" role="button" tabindex="0" aria-label="${c.label}へ移動">${c.label}</span>`;
    });
    html += `</div>`;
  }

  if (node.isPoem) {
    html += `<h3>構成語根</h3>`;
    const parts = node.label.replace(/,/g, '').split(/\s+/);
    parts.forEach(p => {
      const root = findNode(p);
      if (root) {
        html += `<div class="example link-example" data-goto="${root.id}" role="button" tabindex="0">${p} · ${root.meaning}</div>`;
      } else {
        html += `<div class="example">${p}</div>`;
      }
    });
  }

  if (node.type === 'root') {
    html += `<h3>基本例文</h3>`;
    html += `<div class="example">ko sa. · 巣内異常なし</div>`;
    html += `<div class="example">to zu. · 経路異常</div>`;
    html += `<div class="example">fe no. · 痕跡消失</div>`;
    html += `<div class="example">ri no. · 孤立・手薄</div>`;
    html += `<div class="example">ke-ke. · 緊急警戒</div>`;
  }

  // URLハッシュ更新
  history.replaceState(null, '', '#' + node.id);

  drawerContent.innerHTML = html;

  // タグ・例文クリックでノードへジャンプ
  drawerContent.querySelectorAll('[data-goto]').forEach(el => {
    const handler = () => {
      const targetId = el.dataset.goto;
      navigateToNode(targetId);
    };
    el.addEventListener('click', handler);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handler(); } });
  });

  drawer.classList.add('open');
  drawer.scrollTop = 0;
}

function closeDrawer() {
  drawer.classList.remove('open');
  history.replaceState(null, '', window.location.pathname);
}

// 指定IDのノードへジャンプしてドロワーを開く
function navigateToNode(id) {
  const nodeData = findNode(id);
  if (!nodeData) return;
  resetHighlights();
  highlightPath(id);
  activeId = id;
  showDrawer(nodeData);
  const pos = positions[id];
  if (pos && id !== 'arico') {
    panTo(pos.x, pos.y, Math.max(scale, 1.1));
  }
}

// キーボード：Enterでシングルタップ相当、Shift+EnterまたはSpaceでドロワー表示
document.querySelectorAll('.node').forEach(node => {
  node.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      const id = node.dataset.id;
      const nodeData = findNode(id);
      if (!nodeData) return;
      if (e.shiftKey || e.key === ' ') {
        showDrawer(nodeData);
      } else {
        if (activeId === id) {
          resetHighlights(); closeDrawer(); activeId = null;
        } else {
          resetHighlights(); highlightPath(id); activeId = id; closeDrawer();
        }
      }
    }
  });
});
let drawerTouchStart = null;
drawer.addEventListener('touchstart', (e) => {
  if (!isPortrait()) return;
  if (drawer.scrollTop > 0) return;
  drawerTouchStart = { y: e.touches[0].clientY };
}, { passive: true });
drawer.addEventListener('touchmove', (e) => {
  if (!drawerTouchStart) return;
  const dy = e.touches[0].clientY - drawerTouchStart.y;
  if (dy > 0) {
    drawer.style.transform = `translateY(${dy}px)`;
  }
}, { passive: true });
drawer.addEventListener('touchend', (e) => {
  if (!drawerTouchStart) return;
  const dy = (e.changedTouches[0].clientY - drawerTouchStart.y);
  drawer.style.transform = '';
  if (dy > 80) {
    closeDrawer();
    resetHighlights();
    activeId = null;
  }
  drawerTouchStart = null;
});

const stage = document.getElementById('stage');
const canvas = document.getElementById('canvas');
let tx = 0, ty = 0, scale = 1;

function setTransform(s, x, y, animate = false) {
  if (animate) canvas.classList.remove('no-transition');
  else canvas.classList.add('no-transition');
  scale = s;
  tx = x;
  ty = y;
  // canvas-wrap は画面中央に固定された1x1の点
  // JS側は「その点からの相対移動＋スケール」だけ担当
  canvas.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
}

// モバイル/デスクトップそれぞれの初期スケール
function getInitialScale() {
  const isMobile = window.innerWidth < 768 || isPortrait();
  if (isMobile) {
    // モバイル: 中央ノードが確実に見えるスケール
    return 0.7;
  }
  // デスクトップ: ツリー全体フィット
  const margin = 80;
  const needed = (leafRadius + margin) * 2;
  return Math.min(1, window.innerWidth / needed, window.innerHeight * 0.9 / needed);
}

function fitToScreen() {
  // tx=0, ty=0 で SVG原点（Arico）が画面中央に来る
  // （CSS の top:50% left:50% + SVG の translate(-50%,-50%) による）
  setTransform(getInitialScale(), 0, 0, true);
}

function panTo(x, y, s) {
  // SVG座標(x,y)を画面中央に持ってくる
  setTransform(s, -x * s, -y * s, true);
}

// 初期表示：即時 + requestAnimationFrame で確実に適用
fitToScreen();
requestAnimationFrame(() => {
  fitToScreen();
});

// Mouse drag
let isDragging = false;
let dragStart = { x: 0, y: 0, tx: 0, ty: 0 };
stage.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node')) return;
  isDragging = true;
  stage.classList.add('dragging');
  dragStart = { x: e.clientX, y: e.clientY, tx, ty };
  canvas.classList.add('no-transition');
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  tx = dragStart.tx + (e.clientX - dragStart.x);
  ty = dragStart.ty + (e.clientY - dragStart.y);
  setTransform(scale, tx, ty);
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  stage.classList.remove('dragging');
});

// Touch pan / pinch
let touchStart = null;
let pinchStart = null;
stage.addEventListener('touchstart', (e) => {
  if (e.target.closest('.node')) return;
  if (e.touches.length === 1) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, tx, ty };
    canvas.classList.add('no-transition');
  } else if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStart = { dist: Math.hypot(dx, dy), scale };
    touchStart = null;
  }
}, { passive: true });
stage.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1 && touchStart) {
    tx = touchStart.tx + (e.touches[0].clientX - touchStart.x);
    ty = touchStart.ty + (e.touches[0].clientY - touchStart.y);
    setTransform(scale, tx, ty);
  } else if (e.touches.length === 2 && pinchStart) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    scale = Math.max(0.4, Math.min(3, pinchStart.scale * (dist / pinchStart.dist)));
    setTransform(scale, tx, ty);
  }
}, { passive: true });
stage.addEventListener('touchend', () => {
  touchStart = null;
  pinchStart = null;
});

// Wheel zoom — カーソル位置を焦点にして拡大
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = -e.deltaY * 0.001;
  const newScale = Math.max(0.4, Math.min(3, scale * (1 + delta)));
  // カーソルのSVG座標を求め、スケール変化後も同じ画面位置に来るよう補正
  const rect = stage.getBoundingClientRect();
  const cx = e.clientX - rect.left - rect.width / 2;
  const cy = e.clientY - rect.top - rect.height / 2;
  tx = cx - (cx - tx) * (newScale / scale);
  ty = cy - (cy - ty) * (newScale / scale);
  scale = newScale;
  setTransform(scale, tx, ty);
}, { passive: false });

document.getElementById('zoom-in').addEventListener('click', () => {
  setTransform(Math.min(3, scale * 1.25), tx, ty, true);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  setTransform(Math.max(0.4, scale / 1.25), tx, ty, true);
});
document.getElementById('zoom-reset').addEventListener('click', () => {
  fitToScreen();
  closeDrawer();
  resetHighlights();
  activeId = null;
});

stage.addEventListener('click', (e) => {
  if (e.target.closest('.node')) return;
  closeDrawer();
  resetHighlights();
  activeId = null;
});

// resize で fitToScreen を自動実行しない
// （モバイルのアドレスバー伸縮や visualViewport 変化で
//   ユーザーのズーム操作が勝手にリセットされるのを防ぐ）
// リセットしたい時は ○ ボタンで明示的に呼ぶ

// ========== Docs Gallery ==========
const docsModal = document.getElementById('docs-modal');
const docsPages = document.getElementById('docs-pages');

document.getElementById('docs-open').addEventListener('click', () => {
  docsModal.classList.add('open');
  docsPages.scrollTop = 0;
});

document.getElementById('docs-close').addEventListener('click', () => {
  docsModal.classList.remove('open');
});

document.querySelectorAll('.docs-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const lang = tab.dataset.lang;
    document.querySelectorAll('.docs-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.docs-page-set').forEach(set => {
      set.classList.toggle('active', set.dataset.lang === lang);
    });
    docsPages.scrollTop = 0;
  });
});

// Entrance animation — アニメ終了後はインラインstyleを消去してCSS遷移を正常化
window.addEventListener('load', () => {
  document.querySelectorAll('.node').forEach((n, i) => {
    n.style.opacity = '0';
    n.style.transition = 'opacity 0.6s';
    setTimeout(() => {
      n.style.opacity = '1';
      setTimeout(() => {
        n.style.opacity = '';
        n.style.transition = '';
      }, 700);
    }, 100 + i * 30);
  });

  // URLハッシュからノードを開く
  const hash = window.location.hash.slice(1);
  if (hash) {
    setTimeout(() => {
      const nodeData = findNode(hash);
      if (nodeData) navigateToNode(hash);
    }, 800);
  }

  // 初回ヒント表示（localStorage で既読管理）
  if (!localStorage.getItem('arico-hint-seen')) {
    const hint = document.getElementById('hint-overlay');
    if (hint) {
      hint.style.display = 'flex';
      const dismiss = () => {
        hint.style.opacity = '0';
        setTimeout(() => hint.remove(), 400);
        localStorage.setItem('arico-hint-seen', '1');
      };
      hint.addEventListener('click', dismiss);
      hint.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') dismiss(); });
      setTimeout(dismiss, 6000); // 6秒で自動消去
    }
  }
});
</script>
